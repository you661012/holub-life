eight="16" fill="#fff"/><line x1="296" y1="125" x2="484" y2="125" marker-end="url(#m-fill)"/><text x="390" y="120" font-size="12" fill="#000" text-anchor="middle" stroke="none">figureNextState(DUMMY × 8)</text><rect x="484" y="146" width="12" height="16" fill="#fff"/><line x1="296" y1="151" x2="484" y2="151" marker-end="url(#m-fill)"/><text x="390" y="146" font-size="12" fill="#000" text-anchor="middle" stroke="none">[바뀔 칸이 있으면] transition()</text><polyline points="302,168 342,168 342,186 308,186" marker-end="url(#m-fill)"/><text x="348" y="181" font-size="12" fill="#000" stroke="none">++generationNumber; readBoard()</text><polyline points="302,205 342,205 342,223 308,223" marker-end="url(#m-open)"/><text x="348" y="218" font-size="12" fill="#000" stroke="none">invokeLater(상태 반영)  // 기다리지 않는다</text><rect x="20" y="255" width="960" height="160" fill="none" stroke="#777" stroke-dasharray="2 3"/><text x="26" y="409" font-size="11.5" fill="#555" text-anchor="start" stroke="none">Swing 스레드 (나중에)</text><rect x="284" y="268" width="12" height="127" fill="#fff"/><rect x="704" y="285" width="12" height="17" fill="#fff"/><line x1="296" y1="290" x2="704" y2="290" marker-end="url(#m-fill)"/><text x="500" y="285" font-size="12" fill="#000" text-anchor="middle" stroke="none">update(세대, 칸 수, 규칙, 변경 번호)  // 남은 세대 − 1</text><rect x="704" y="320" width="12" height="16" fill="#fff"/><line x1="296" y1="325" x2="704" y2="325" marker-end="url(#m-fill)"/><text x="500" y="320" font-size="12" fill="#000" text-anchor="middle" stroke="none">isFinished()</text><line x1="704" y1="345" x2="296" y2="345" stroke-dasharray="5 4" marker-end="url(#m-open)"/><text x="500" y="340" font-size="12" fill="#000" text-anchor="middle" stroke="none">true  (예측한 소멸·정지에 도달)</text><rect x="74" y="368" width="12" height="16" fill="#fff"/><line x1="284" y1="373" x2="86" y2="373" marker-end="url(#m-fill)"/><text x="185" y="368" font-size="12" fill="#000" text-anchor="middle" stroke="none">stop()</text></svg>