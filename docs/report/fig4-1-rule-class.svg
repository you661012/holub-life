<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" fill="none" stroke="#000" stroke-width="1"><defs>
<marker id="m-open" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="14" markerHeight="14" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1,1 L13,7 L1,13" fill="none" stroke="#000" stroke-width="1"/></marker>
<marker id="m-tri" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="16" markerHeight="16" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1,1 L15,8 L1,15 Z" fill="#fff" stroke="#000" stroke-width="1"/></marker>
<marker id="m-fill" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1,1 L13,7 L1,13 Z" fill="#000" stroke="none"/></marker>
<marker id="m-dia-fill" viewBox="0 0 20 12" refX="1" refY="6" markerWidth="20" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,6 L10,1 L19,6 L10,11 Z" fill="#000" stroke="#000"/></marker>
<marker id="m-dia" viewBox="0 0 20 12" refX="1" refY="6" markerWidth="20" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M1,6 L10,1 L19,6 L10,11 Z" fill="#fff" stroke="#000"/></marker>
</defs><rect width="980" height="560" fill="#fff" stroke="none"/><text x="20" y="26" font-size="14" fill="#000" font-weight="bold" stroke="none">변경 전 (원본)</text><rect x="20" y="50" width="250" height="104" fill="#fff" /><text x="145" y="69" font-size="13.5" fill="#000" text-anchor="middle" font-weight="bold" stroke="none">Resident</text><line x1="20" y1="78" x2="270" y2="78" /><text x="27" y="94" font-size="12.5" fill="#000" stroke="none">-amAlive : boolean</text><text x="27" y="110" font-size="12.5" fill="#000" stroke="none">-willBeAlive : boolean</text><line x1="20" y1="116" x2="270" y2="116" /><text x="27" y="132" font-size="12.5" fill="#000" stroke="none">+figureNextState(Cell × 8) : boolean</text><text x="27" y="148" font-size="12.5" fill="#000" stroke="none">+create() : Cell</text><path d="M20,188 h214 l12,12 v64 h-226 z" fill="#fff"/><path d="M234,188 v12 h12"/><text x="29" y="207" font-size="12" fill="#000" stroke="none">willBeAlive =</text><text x="29" y="223" font-size="12" fill="#000" stroke="none">  (neighbors==3 ||</text><text x="29" y="239" font-size="12" fill="#000" stroke="none">   (amAlive &amp;&amp; neighbors==2));</text><text x="29" y="255" font-size="12" fill="#000" stroke="none">Conway 규칙이 Resident 안에 있다</text><line x1="145" y1="188" x2="145" y2="154" stroke-dasharray="2 3"/><line x1="300" y1="20" x2="300" y2="540" stroke="#999" stroke-dasharray="3 4"/><text x="325" y="26" font-size="14" fill="#000" font-weight="bold" stroke="none">변경 후</text><rect x="325" y="50" width="200" height="72" fill="#fff" /><text x="425" y="69" font-size="13.5" fill="#000" text-anchor="middle" font-weight="bold" stroke="none">Universe</text><line x1="325" y1="78" x2="525" y2="78" /><line x1="325" y1="100" x2="525" y2="100" /><text x="332" y="116" font-size="12.5" fill="#000" stroke="none">+Universe()</text><rect x="325" y="250" width="250" height="120" fill="#fff" /><text x="450" y="269" font-size="13.5" fill="#000" text-anchor="middle" font-weight="bold" stroke="none">Resident</text><line x1="325" y1="278" x2="575" y2="278" /><text x="332" y="294" font-size="12.5" fill="#000" stroke="none">-amAlive : boolean</text><text x="332" y="310" font-size="12.5" fill="#000" stroke="none">-willBeAlive : boolean</text><line x1="325" y1="316" x2="575" y2="316" /><text x="332" y="332" font-size="12.5" fill="#000" stroke="none">+Resident(RuleHolder)</text><text x="332" y="348" font-size="12.5" fill="#000" stroke="none">+figureNextState(Cell × 8) : boolean</text><text x="332" y="364" font-size="12.5" fill="#000" stroke="none">+create() : Cell</text><text x="575" y="244" font-size="12" fill="#2155A4" text-anchor="end" font-style="italic" stroke="none">Context</text><rect x="640" y="50" width="220" height="88" fill="#EEF3FB" stroke="#2155A4" stroke-width="1.8"/><text x="750" y="69" font-size="13.5" fill="#000" text-anchor="middle" font-weight="bold" stroke="none">RuleHolder</text><line x1="640" y1="78" x2="860" y2="78" stroke="#2155A4" stroke-width="1.8"/><line x1="640" y1="100" x2="860" y2="100" stroke="#2155A4" stroke-width="1.8"/><text x="647" y="116" font-size="12.5" fill="#000" stroke="none">+current() : Rule</text><text x="647" y="132" font-size="12.5" fill="#000" stroke="none">+change(Rule)</text><rect x="640" y="250" width="330" height="66" fill="#EEF3FB" stroke="#2155A4" stroke-width="1.8"/><text x="805" y="269" font-size="12" fill="#000" text-anchor="middle" stroke="none">«interface»</text><text x="805" y="285" font-size="13.5" fill="#000" text-anchor="middle" font-style="italic" stroke="none">Rule</text><line x1="640" y1="294" x2="970" y2="294" stroke="#2155A4" stroke-width="1.8"/><text x="647" y="310" font-size="12.5" fill="#000" font-style="italic" stroke="none">+nextState(alive : boolean, neighbors : int) : boolean</text><text x="970" y="244" font-size="12" fill="#2155A4" text-anchor="end" font-style="italic" stroke="none">Strategy</text><rect x="340" y="450" width="170" height="50" fill="#EEF3FB" stroke="#2155A4" stroke-width="1.8"/><text x="425" y="469" font-size="13.5" fill="#000" text-anchor="middle" font-weight="bold" stroke="none">ConwayRule</text><line x1="340" y1="478" x2="510" y2="478" stroke="#2155A4" stroke-width="1.8"/><text x="347" y="494" font-size="12.5" fill="#000" stroke="none">+nextState(…) : boolean</text><rect x="560" y="450" width="170" height="50" fill="#EEF3FB" stroke="#2155A4" stroke-width="1.8"/><text x="645" y="469" font-size="13.5" fill="#000" text-anchor="middle" font-weight="bold" stroke="none">HighLifeRule</text><line x1="560" y1="478" x2="730" y2="478" stroke="#2155A4" stroke-width="1.8"/><text x="567" y="494" font-size="12.5" fill="#000" stroke="none">+nextState(…) : boolean</text><rect x="780" y="450" width="190" height="104" fill="#EEF3FB" stroke="#2155A4" stroke-width="1.8"/><text x="875" y="469" font-size="13.5" fill="#000" text-anchor="middle" font-weight="bold" stroke="none">BirthSurvivalRule</text><line x1="780" y1="478" x2="970" y2="478" stroke="#2155A4" stroke-width="1.8"/><text x="787" y="494" font-size="12.5" fill="#000" stroke="none">-birth : String</text><text x="787" y="510" font-size="12.5" fill="#000" stroke="none">-survival : String</text><line x1="780" y1="516" x2="970" y2="516" stroke="#2155A4" stroke-width="1.8"/><text x="787" y="532" font-size="12.5" fill="#000" stroke="none">+BirthSurvivalRule(String)</text><text x="787" y="548" font-size="12.5" fill="#000" stroke="none">+nextState(…) : boolean</text><text x="970" y="570" font-size="12" fill="#2155A4" text-anchor="end" font-style="italic" stroke="none">ConcreteStrategy (셋 모두)</text><polyline points="525,86 640,94"  marker-end="url(#m-open)"  /><text x="630" y="84" font-size="12" fill="#000" text-anchor="end" stroke="none">ruleHolder</text><path d="M325,150 h331 l12,12 v16 h-343 z" fill="#fff"/><path d="M656,150 v12 h12"/><text x="334" y="169" font-size="12" fill="#000" stroke="none">Rule 메뉴: ruleHolder.change(new HighLifeRule())</text><line x1="425" y1="150" x2="425" y2="122" stroke-dasharray="2 3"/><polyline points="575,290 610,290 610,120 640,116"  marker-end="url(#m-open)"  /><text x="634" y="110" font-size="12" fill="#000" text-anchor="end" stroke="none">holder</text><polyline points="750,138 750,230 805,230 805,250"  marker-end="url(#m-open)"  /><text x="813" y="244" font-size="12" fill="#000" text-anchor="start" stroke="none">current  {volatile}</text><polyline points="575,320 640,320" stroke-dasharray="6 4" marker-end="url(#m-open)"  /><text x="615" y="314" font-size="12" fill="#000" text-anchor="middle" stroke="none">nextState()</text><polyline points="425,450 425,425 785,425 785,316" stroke-dasharray="6 4" marker-end="url(#m-tri)"  /><line x1="645" y1="450" x2="645" y2="425" stroke-dasharray="6 4"/><polyline points="875,450 875,425 785,425" stroke-dasharray="6 4"/><text x="20" y="545" font-size="12" fill="#2155A4" stroke="none">파란 테두리 = 이번 프로젝트에서 새로 만든 클래스.  파란 기울임 글자 = Strategy 패턴에서의 역할</text></svg>