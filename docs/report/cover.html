<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>표지</title>
<style>
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    color: #1c1f1a;
  }
  .page {
    width: 210mm; height: 297mm;
    padding: 34mm 26mm 26mm;
    display: flex; flex-direction: column;
  }
  .course { font-size: 11pt; letter-spacing: .02em; color: #5b6156; }
  .rule { height: 1.2pt; background: #1c1f1a; margin: 6mm 0 14mm; width: 28mm; }
  h1 { font-size: 27pt; line-height: 1.3; margin: 0; font-weight: 800; letter-spacing: -.01em; }
  .sub { margin-top: 7mm; font-size: 13pt; line-height: 1.6; color: #3d4239; }
  /* 64칸 판을 줄인 그림: Glider 한 마리 */
  .board { margin-top: 18mm; display: grid; grid-template-columns: repeat(16, 4.2mm); gap: .5mm; }
  .board span { width: 4.2mm; height: 4.2mm; background: #ecebd9; }
  .board span.on { background: #c8372d; }
  .spacer { flex: 1; }
  table { border-collapse: collapse; font-size: 11.5pt; }
  td { padding: 2.2mm 0; vertical-align: top; }
  td.k { width: 30mm; color: #5b6156; }
  .foot { margin-top: 14mm; padding-top: 6mm; border-top: .6pt solid #c9cbc2; font-size: 11pt; display: flex; justify-content: space-between; align-items: center; color: #3d4239; }
  .foot .logo { height: 11mm; width: auto; }
</style>
</head>
<body>
<div class="page">
  <div class="course">설계패턴 (Design Patterns) 01분반 · 2026 Term Project</div>
  <div class="rule"></div>
  <h1>Holub Life Game<br>기능 확장 및 설계 개선</h1>
  <div class="sub">규칙을 입력하고 세포를 놓으면,<br>프로그램이 결말을 예측해 준다</div>
  <div class="board" id="board"></div>
  <div class="spacer"></div>
  <table>
    <tr><td class="k">팀</td><td>Team 13</td></tr>
    <tr><td class="k">작성자</td><td>20231887&nbsp;&nbsp;전수환</td></tr>
    <tr><td class="k">담당 교수</td><td>이찬근 교수님</td></tr>
    <tr><td class="k">GitHub</td><td>github.com/you661012/holub-life</td></tr>
    <tr><td class="k">제출일</td><td>2026년 11월 29일</td></tr>
  </table>
  <div class="foot"><img class="logo" src="cau-logo.png" alt="중앙대학교"><span>소프트웨어학부</span></div>
</div>
<script>
  // 16×4 칸에 Glider (1,0),(2,1),(0,2),(1,2),(2,2)를 (2,0)만큼 옮겨 놓는다
  const on = new Set(["3,0","4,1","2,2","3,2","4,2"]);
  const b = document.getElementById("board");
  for (let y = 0; y < 4; y++) for (let x = 0; x < 16; x++) {
    const s = document.createElement("span");
    if (on.has(x + "," + y)) s.className = "on";
    b.appendChild(s);
  }
</script>
</body>
</html>
