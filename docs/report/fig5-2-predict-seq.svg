ight="16" fill="#fff"/><line x1="202" y1="317" x2="644" y2="317" marker-end="url(#m-fill)"/><text x="423" y="312" font-size="12" fill="#000" text-anchor="middle" stroke="none">request(request)</text><line x1="644" y1="336" x2="202" y2="336" stroke-dasharray="5 4" marker-end="url(#m-open)"/><text x="423" y="331" font-size="12" fill="#000" text-anchor="middle" stroke="none">바로 돌아온다</text><rect x="560" y="380" width="400" height="100" fill="none" stroke="#777" stroke-dasharray="2 3"/><text x="954" y="474" font-size="11.5" fill="#555" text-anchor="end" stroke="none">prediction 스레드</text><rect x="644" y="395" width="12" height="75" fill="#fff"/><rect x="834" y="405" width="12" height="35" fill="#fff"/><line x1="656" y1="410" x2="834" y2="410" marker-end="url(#m-fill)"/><text x="745" y="405" font-size="12" fill="#000" text-anchor="middle" stroke="none">predict(start, rule)</text><line x1="834" y1="452" x2="656" y2="452" stroke-dasharray="5 4" marker-end="url(#m-open)"/><text x="745" y="447" font-size="12" fill="#000" text-anchor="middle" stroke="none">ending</text><text x="664" y="430" font-size="11.5" fill="#555" stroke="none">Universe가 넘겨준 함수로 부른다</text><text x="852" y="428" font-size="11.5" fill="#555" stroke="none">최대 500세대</text><line x1="644" y1="465" x2="196" y2="465" marker-end="url(#m-open)"/><text x="420" y="460" font-size="12" fill="#000" text-anchor="middle" stroke="none">invokeLater(결과 반영)</text><rect x="110" y="478" width="440" height="90" fill="none" stroke="#777" stroke-dasharray="2 3"/><text x="116" y="562" font-size="11.5" fill="#555" text-anchor="start" stroke="none">Swing 스레드</text><rect x="184" y="485" width="12" height="70" fill="#fff"/><rect x="484" y="500" width="12" height="18" fill="#fff"/><line x1="196" y1="505" x2="484" y2="505" marker-end="url(#m-fill)"/><text x="340" y="500" font-size="12" fill="#000" text-anchor="middle" stroke="none">accept(request, ending)</text><text x="500" y="530" font-size="11.5" fill="#555" stroke="none">변경 번호가 다르면 버린