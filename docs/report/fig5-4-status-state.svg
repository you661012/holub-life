<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" font-family="Arial, 'Apple SD Gothic Neo', sans-serif" fill="none" stroke="#000" stroke-width="1"><defs>
