</defs><rect width="1000" height="590" fill="#fff" stroke="none"/><rect x="60" y="30" width="925" height="440" rx="18" fill="#fff"/><text x="78" y="52" font-size="13" fill="#000" font-weight="bold" stroke="none">창 아랫줄 (예측한 결말)</text><line x1="60" y1="62" x2="985" y2="62"/><circle cx="92" cy="125" r="8" fill="#000"/><rect x="130" y="95" width="170" height="58" rx="14" fill="#fff"/><text x="215" y="120" font-size="13" fill="#000" text-anchor="middle" stroke="none">계산 중</text><text x="215" y="138" font-size="13" fill="#000" text-anchor="middle" stroke="none">calculating...</text><rect x="470" y="95" width="230" height="76" rx="14" fill="#fff"/><text x="585" y="120" font-size="13" fill="#000" text-anchor="middle" stroke="none">결말까지 남음</text><text x="585" y="138" font-size="13" fill="#000" text-anchor="middle" stroke="none">still / extinct / repeats</text><text x="585" y="156" font-size="13" fill="#000" text-anchor="middle" stroke="none">in N generations</text><rect x="770" y="95" width="200" height="58" rx="14" fill="#fff"/><text x="870" y="120" font-size="13" fill="#000" text-anchor="middle" stroke="none">결말에 도달</text><text x="870" y="138" font-size="13" fill="#000" text-anchor="middle" stroke="none">still / extinct / repeating</text><rect x="470" y="330" width="230" height="76" rx="14" fill="#fff"/><text x="585" y="355" font-size="13" fill="#000" text-anchor="middle" stroke="none">미확정</text><text x="585" y="373" font-size="13" fill="#000" text-anchor="middle" stroke="none">undecided within</text><text x="585" y="391" font-size="13" fill="#000" text-anchor="middle" stroke="none">500 generations</text><path d="M100,125 L130,119" marker-end="url(#m-open)"/><path d="M300,110 L470,119" marker-end="url(#m-open)"/><text x="385" y="128" font-size="12" fill="#000" text-anchor="middle" stroke="none">결과 도착</text><text x="385" y="143" font-size="12" fill="#000" text-anchor="middle" stroke="none">[같은 변경 번호, 소멸·정지·반복, N &gt; 0]</text><polyline points="255,95 255,80 870,80 870,95" marker-end="url(#m-open)"/><text x="600" y="76" font-size="12" fill="#000" text-anchor="middle" stroke="none">결과 도착 [같은 변경 번호, 소멸·정지·반복, N ≤ 0]</text><path d="M245,153 L245,368 L470,368" marker-end="url(#m-open)"/><text x="300" y="338" font-size="12" fill="#000" text-anchor="middle" stroke="none">결과 도착</text><text x="300" y="353" font-size="12" fill="#000" text-anchor="middle" stroke="none">[같은 변경 번호, 미확정]</text><path d="M700,133 L770,124" marker-end="url(#m-open)"/><text x="735" y="125" font-size="12" fill="#000" text-anchor="middle" stroke="none">[N ≤ 0]</text><path d="M525,171 L525,211 L575,211 L575,171" marker-end="url(#m-open)"/><text x="550" y="229" font-size="12" fill="#000" text-anchor="middle" stroke="none">세대 진행 / N ← N − 1</text><path d="M165,153 L165,193 L205,193 L205,153" marker-end="url(#m-open)"/><text x="185" y="211" font-size="12" fill="#000" text-anchor="middle" stroke="none">결과 도착 [다른 변경 번호]</text><text x="185" y="226" font-size="12" fill="#000" text-anchor="middle" stroke="none">/ 버린다</text><path d="M330,470 L330,515 L36,515 L36,136 L130,136" marker-end="url(#m-open)"/><text x="420" y="540" font-size="12" fill="#000" text-anchor="middle" stroke="none">클릭 · Clear · Load · 규칙 변경 / 변경 번호 + 1   (어느 상태에서든)</text><path d="M760,250 h210 l12,12 v48 h-222 z" fill="#fff"/><path d="M970,250 v12 h12"/><text x="769" y="269" font-size="12" fill="#000" stroke="none">소멸·정지에 도달하면</text><text x="769" y="285" font-size="12" fill="#000" stroke="none">Universe가 시계를 멈춘다</text><text x="769" y="301" font-size="12" fill="#000" stroke="none">(자동 정지). 반복은 멈추지 않는다</text><line x1="840" y1="250" x2="840" y2="153" stroke-dasharray="2 3"/></svg>